# ---------------------------------------------------------------------------
# Duvet Cover Set — colour/size cold-start demand forecasting
# ---------------------------------------------------------------------------
project:
  gcp_project: california-desig-1536902647897
  prod_dataset: amazon_us_dataset_prod
  mapper_table: cdd_pluto7_dataset.cdd_us_mapper_automated

# Programs pulled from the mapper. `focal` is what we forecast/recommend for;
# `auxiliary` programs only widen the pool of historical launch curves that the
# cold-start and look-alike models learn from.
programs:
  # The launch programme. NB the mapper string is "400 TC Duvet Cover" (85
  # ASINs); the CasePack / Bundle / 2-Pack variants are separate programmes and
  # are deliberately excluded.
  focal: "400 TC Duvet Cover"
  auxiliary:
    - "Duvet Cover Set"
    - "Organic Duvet Cover Set"

  # Restrict every colour/velocity estimate to the focal programme. Set after
  # finding that Silver was over-called 4.3x in DCS in BOTH test months because
  # 400 TC's Silver sold well - a cross-programme transfer error.
  restrict_to_focal: true

  # Size ratios are a *structural* parameter (how a Twin relates to a Queen),
  # not a colour velocity, and the focal programme cannot estimate them: DCS has
  # exactly 2 usable size-ratio cohorts and NEITHER contains a Twin. Set to
  # "focal" to forbid borrowing and fall back to fixed priors instead.
  size_ratio_source: all_programmes

# Backtest split. Train on everything up to and including `train_end`;
# score strictly on `test_start`..`test_end`. No feature may look past train_end.
split:
  history_start: "2019-05-01"
  train_end: "2026-05-31"
  test_start: "2026-06-01"
  test_end: "2026-07-31"

# Sizes carried through the hierarchy. Oversized King is kept in the panel for
# ratio estimation but excluded from the order recommendation by default.
sizes:
  anchor: "Queen"
  recommend: ["Queen", "King", "Twin"]
  keep: ["Queen", "King", "Twin", "Oversized King"]

# Demand definition used for fitting. "organic" strips PPC-attributed units so
# the baseline reflects organic colour appeal; "total" keeps gross demand.
target:
  demand: organic

# Business rules from the heuristic model, kept explicit so they can be
# challenged by the fitted models rather than silently assumed.
business:
  core_sku_colour: "White"          # separate demand pool, excluded from baseline
  ramp_month1_factor: 0.45          # heuristic prior; growth models re-estimate
  size_ratio_prior:                 # heuristic priors vs Queen anchor
    King: 0.76
    Twin: 0.60
  horizon_days: 120
  lead_time_days: 120
  # Order quantity comes from the newsvendor critical fractile Cu/(Cu+Co),
  # derived from these two ratios, rather than from a chosen service level.
  # A month-3 stock-out damages search rank, so understocking costs ~4x
  # overstocking -> fractile 0.80. Setting 0.95 here instead would imply
  # ordering ~4.4x the point forecast at the measured uncertainty, which is
  # not a usable policy.
  # Approved 2026-08-27: a month-3 stock-out kills organic rank and forces a
  # PPC restart from scratch, which is far costlier than carrying extra stock.
  # Ratio set to 9:1 -> critical fractile 9/(9+1) = 0.90.
  holding_cost_ratio: 0.10          # carrying/markdown cost per overstocked unit
  stockout_cost_ratio: 0.90         # lost margin + rank damage + PPC restart
  service_level: 0.90               # informational; recomputed from the ratios
  n_new_variants: 6

# Clean-day definition. ASIN-level deal table is stale after 2025-12-02, so the
# global no-deal calendar is the primary filter; a robust velocity screen
# catches residual promo spikes.
clean_days:
  use_no_deal_calendar: true
  spike_mad_threshold: 4.0          # drop days > k*MAD above SKU rolling median

# Predictive intervals. Model-derived bands were too wide to order against
# (Silver Queen came back as 8-173 units for an actual of 13). Bands are now
# calibrated empirically on focal-programme out-of-fold residuals, which gives
# the narrowest band that still achieves the nominal coverage. Achieved coverage
# is always reported alongside, because tightening a band below what the data
# supports does not reduce risk - it only hides it.
intervals:
  method: conformal_oof        # conformal_oof | model
  nominal: 0.80
  floor_ratio: 0.35            # lo may not fall below this x the point forecast
  cap_ratio: 3.00              # hi may not exceed this x the point forecast

modeling:
  random_seed: 42
  min_train_days: 21
  launch_window_days: 120           # length of a launch curve used for matching
